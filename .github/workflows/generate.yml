name: Generate answers

on:
  workflow_dispatch:
    inputs:
      budget_min:
        description: "Time budget in minutes for this run"
        default: "330"
      max_books:
        description: "Max books to process (0 = no limit)"
        default: "0"
  schedule:
    # every 3 hours
    - cron: "0 */3 * * *"

concurrency:
  group: generate-answers
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python deps
        run: pip install --quiet pymupdf requests

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install opencode CLI
        run: npm install --global opencode-ai@latest

      - name: opencode version
        run: opencode --version

      - name: Generate page answers
        env:
          BUDGET_MIN: ${{ github.event.inputs.budget_min || '330' }}
          MAX_BOOKS: ${{ github.event.inputs.max_books || '0' }}
          OPENCODE_MODEL: opencode/deepseek-v4.1-flash-free
        run: python pipeline/run_batch.py

      - name: Refresh counts
        run: python pipeline/patch_counts.py

      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/qa_full data/books.json
          if git diff --cached --quiet; then
            echo "nothing to commit"
          else
            git commit -m "Generate page answers [skip ci]"
            git push
          fi
